<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#121722" />
    <meta
      name="description"
      content="Send a link. Pick your times. Get together. Plan a hangout without the endless group chat."
    />
    <meta property="og:title" content="Yo, You Down?" />
    <meta
      property="og:description"
      content="Less planning. More hanging. Find a time that works for your people."
    />
    <title>Yo, You Down? — Find your hangout time</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script src="./theme.js"></script>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <a class="wordmark" href="#" aria-label="Yo, You Down? home"><span class="brand-token">yo</span><span class="brand-text">you down<span>?</span></span></a>
        <span class="header-note">GOOD TIMES, LESS GROUP CHAT.</span>
        <div class="header-actions">
          <button
            class="theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Switch to light mode"
          >
            <span class="theme-icon" aria-hidden="true"></span><span class="theme-label">Light mode</span>
          </button>
          <a class="small-button" href="#create">New plan <span aria-hidden="true">＋</span></a>
        </div>
      </header>
      <main id="app"></main>
      <footer>
        <span>LESS PLANNING. MORE HANGING.</span><span>yo, you down? <b>●</b></span>
      </footer>
    </div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <noscript
      >This app needs JavaScript to create hangouts and select availability. Please enable it in
      your browser.</noscript
    >
  </body>
</html>
